name: validate-unified-etf
# The domestic launchd job is the only data writer (08:50 / 20:40 KST).
# Offshore runners cannot reliably collect TIGER / RISE. Do not reintroduce a second writer.
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'assets/**', '*.html', '.github/workflows/refresh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/daily.js
