name: refresh-etf-data

# 평일 저녁(KST 20:10 = UTC 11:10) 자동 갱신 + 수동 실행
#
# 예전엔 16:10 KST 였는데, KRX OPEN API 일별매매정보는 마감 40분 뒤엔 아직 안 올라온다.
# 그래서 매번 조용히 전 영업일로 폴백 → 기준일이 상시 하루 밀려 있었다(2026-08-10 발견).
# 운용사 PDF 는 저녁에도 문제없이 받힌다.
on:
  schedule:
    - cron: "10 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # SOL 처럼 과거 PDF 를 안 주는 운용사는 정기변경 비교에 data/holdings 커밋 이력(일별 스냅샷)을 쓴다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      # TIGER(403)·RISE(KB 사이트 접속 불가)는 해외 IP 를 막는다 → 여기선 건너뛰고 기존 파일을 유지,
      # 국내 PC(Mac mini launchd)의 scripts/local_refresh.py 가 따로 채워 push 한다.
      - name: Build data (KRX snapshot + 운용사 PDF + 비중 cap)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SKIP_MANAGERS: TIGER,RISE
        run: |
          cd scripts
          python refresh_all.py

      # 최근 정기변경 전후 PDF 비교 + 아직 못 채운 과거분을 12분 예산만큼 이어서 백필
      # (KODEX 는 레이트리밋이 세서 한 번에 다 못 받는다 → 매일 조금씩)
      - name: 정기변경 이력
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SKIP_MANAGERS: TIGER,RISE
        run: |
          cd scripts
          python rebal_history.py --backfill --budget 12

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 자동 갱신 (기준일 $(python -c "import json;print(json.load(open('data/etfs.json'))['as_of'])"))"
            git push
          fi

      # KRX 가 아직 안 올렸는데 조용히 전 영업일로 폴백하면 기준일이 계속 밀린다 — 로그로 드러낸다.
      - name: 기준일 확인
        run: python scripts/check_asof.py

      # 휴장일 캘린더가 실제 거래일과 어긋나면(임시공휴일 지정 등) 로그에 남긴다. 실패시키진 않는다.
      - name: 휴장일 캘린더 검증
        continue-on-error: true
        run: |
          cd scripts
          python kr_holidays.py --verify
